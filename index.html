<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mega Tetris — a cheerful falling-block arcade</title>
    <meta
      name="description"
      content="Mega Tetris is a bright little falling-block puzzle game that runs entirely in your browser. Stack, spin and clear lines with the keyboard — no install, no account, no waiting."
    />
    <!--
      The cabinet's own `--cabinet-deep`, before the stylesheet has loaded and
      before any script has run. `src/ui/pwa.ts` keeps it in step with the
      contrast setting from there on; `build/manifest.test.ts` fails if this
      copy ever drifts from the palette.
    -->
    <meta name="theme-color" content="#120b1b" />
    <meta name="color-scheme" content="dark" />
    <!--
      The favicon, the Apple touch icon, the manifest link and the standalone
      metas are injected into this head by `build/plugin.ts` — all of them are
      generated from `src/style.css` and `build/icon.ts`, so there is no hex
      here to fall out of date. The favicon is still an inline SVG data URI:
      no image asset, no extra request, nothing to block first paint.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
